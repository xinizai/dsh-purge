
name: Sync Fork

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh api "repos/$REPO" --jq '.default_branch')
          gh api --method POST "repos/$REPO/merge-upstream" \
            -f branch="$BRANCH"
